<!DOCTYPE html>
<html lang="pt-BR" >
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento da casa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EBEFE8;
  --surface:#FFFFFF;
  --surface-2:#F4F7F1;
  --line:#D6DDD1;
  --line-strong:#B9C4B3;
  --ink:#122420;
  --ink-2:#4B5A53;
  --ink-3:#7A8880;
  --viridian:#1C6B58;
  --viridian-2:#2A8F76;
  --viridian-soft:#D9E9E2;
  --ochre:#A77416;
  --ochre-soft:#F2E6C8;
  --azure:#3B54A0;
  --azure-soft:#DCE2F4;
  --clay:#9E3B26;
  --clay-soft:#F4DCD5;
  --shadow:0 1px 0 rgba(18,36,32,.06);
  --font-display:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0D1714;
    --surface:#15211D;
    --surface-2:#1B2823;
    --line:#2A3832;
    --line-strong:#3C4C45;
    --ink:#E6EDE8;
    --ink-2:#A6B4AC;
    --ink-3:#7C8C84;
    --viridian:#52BC9D;
    --viridian-2:#6ACFB1;
    --viridian-soft:#17332B;
    --ochre:#D9A94E;
    --ochre-soft:#332A15;
    --azure:#8298DF;
    --azure-soft:#1B2340;
    --clay:#D9765C;
    --clay-soft:#37201A;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --canvas:#0D1714;--surface:#15211D;--surface-2:#1B2823;--line:#2A3832;--line-strong:#3C4C45;
  --ink:#E6EDE8;--ink-2:#A6B4AC;--ink-3:#7C8C84;--viridian:#52BC9D;--viridian-2:#6ACFB1;--viridian-soft:#17332B;
  --ochre:#D9A94E;--ochre-soft:#332A15;--azure:#8298DF;--azure-soft:#1B2340;--clay:#D9765C;--clay-soft:#37201A;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-.015em; font-weight:600; line-height:1.2}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--viridian-2); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }

/* ---------- shell ---------- */
.shell{display:flex; min-height:100%; flex-direction:column}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-top,0px));
  display:flex; gap:14px; align-items:center; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand .mark{
  font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.03em; color:var(--viridian);
}
.brand .sub{font-size:12.5px; color:var(--ink-3)}
.period{display:flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px}
.period button{background:none; border:0; cursor:pointer; padding:5px 9px; border-radius:999px; color:var(--ink-2); line-height:1}
.period button:hover{background:var(--line)}
.period .label{font-family:var(--font-display); font-weight:600; font-size:14px; min-width:9.5ch; text-align:center; color:var(--ink)}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px}
.seg button{border:0; background:none; cursor:pointer; padding:5px 12px; border-radius:999px; font-size:13.5px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--viridian); color:#fff}
.nav{
  background:var(--canvas); border-bottom:1px solid var(--line);
  display:flex; gap:2px; overflow-x:auto; padding:0 10px; scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0; background:none; cursor:pointer; white-space:nowrap;
  padding:11px 12px 9px; font-size:14px; color:var(--ink-2);
  border-bottom:2px solid transparent; font-family:var(--font-display); font-weight:500;
}
.nav button[aria-current="true"]{color:var(--viridian); border-bottom-color:var(--viridian)}
main{padding:20px 16px 72px; max-width:1180px; width:100%; margin:0 auto}
@media (min-width:760px){ main{padding:26px 24px 80px} .topbar{padding-left:24px; padding-right:24px} .nav{padding:0 18px} }

/* ---------- section ---------- */
.sec{margin:0 0 28px}
.sec-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.sec-head h2{font-size:15.5px; font-weight:600}
.sec-head .rule{flex:1; height:1px; background:var(--line)}
.sec-head .aside{font-size:13px; color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* ---------- ledger figure ---------- */
.figrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.fig{background:var(--surface); padding:13px 14px}
.fig .k{font-size:12.5px; color:var(--ink-3); margin-bottom:3px}
.fig .v{font-family:var(--font-display); font-weight:600; font-size:20px; letter-spacing:-.02em}
.fig .n{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.pos{color:var(--viridian)} .neg{color:var(--clay)}

/* ---------- headline ---------- */
.headline{
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  padding:18px 18px 16px; margin-bottom:18px;
}
.headline .lead{font-size:13px; color:var(--ink-3)}
.headline .amount{font-family:var(--font-display); font-weight:700; font-size:clamp(30px,7vw,44px); letter-spacing:-.035em; line-height:1.05; margin:2px 0 4px}
.headline .note{font-size:13.5px; color:var(--ink-2)}
.flowbars{margin-top:16px; display:grid; gap:9px}
.flowbar{display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:10px; font-size:13px}
.flowbar .track{height:12px; background:var(--surface-2); border-radius:3px; overflow:hidden; border:1px solid var(--line)}
.flowbar .fill{height:100%; border-radius:2px}
.flowbar .amt{font-weight:500; min-width:11ch; text-align:right}

/* ---------- the 50/30/20 band (signature) ---------- */
.band{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:16px 16px 14px}
.band-track{position:relative; height:44px; border-radius:6px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); display:flex}
.band-seg{height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12.5px; font-weight:600; font-family:var(--font-display); min-width:0; overflow:hidden}
.band-seg.n{background:var(--viridian)} .band-seg.d{background:var(--ochre)} .band-seg.m{background:var(--azure)}
.band-seg.rest{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 6px,var(--line) 6px,var(--line) 7px); color:var(--ink-3)}
.band-marks{position:relative; height:20px; margin-top:4px}
.band-mark{position:absolute; top:0; transform:translateX(-50%); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.band-mark::before{content:""; position:absolute; left:50%; top:-48px; height:44px; width:1px; background:var(--ink-2); opacity:.55}
.band-legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:16px}
.leg{border-left:3px solid var(--line); padding-left:10px}
.leg.n{border-color:var(--viridian)} .leg.d{border-color:var(--ochre)} .leg.m{border-color:var(--azure)}
.leg .t{font-size:13px; color:var(--ink-2)}
.leg .v{font-family:var(--font-display); font-weight:600; font-size:17px}
.leg .s{font-size:12.5px}

/* ---------- rail (independência) ---------- */
.rail{position:relative; height:16px; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; overflow:hidden}
.rail .fill{height:100%; background:linear-gradient(90deg,var(--viridian),var(--viridian-2))}
.rail.alt .fill{background:linear-gradient(90deg,var(--azure),var(--azure))}

/* ---------- tables ---------- */
.tablewrap{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:720px}
thead th{
  text-align:left; font-weight:500; font-size:12px; color:var(--ink-3);
  padding:9px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap;
}
tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right; white-space:nowrap}
td.act{text-align:right; white-space:nowrap}
.desc{font-weight:500}
.sub{font-size:12px; color:var(--ink-3)}
.pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:500; white-space:nowrap}
.pill.ok{background:var(--viridian-soft); color:var(--viridian)}
.pill.wait{background:var(--ochre-soft); color:var(--ochre)}
.pill.late{background:var(--clay-soft); color:var(--clay)}
.pill.n{background:var(--viridian-soft); color:var(--viridian)}
.pill.d{background:var(--ochre-soft); color:var(--ochre)}
.pill.m{background:var(--azure-soft); color:var(--azure)}
.pill.q{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13.5px; font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--viridian); border-color:var(--viridian); color:#fff}
.btn.primary:hover{background:var(--viridian-2); border-color:var(--viridian-2)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2); padding:5px 8px}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.danger:hover{background:var(--clay-soft); color:var(--clay)}
.btn.danger:not(.ghost){color:var(--clay); border-color:var(--clay)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.toolbar .grow{flex:1}
.field-inline{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2)}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:7px; padding:7px 9px; font-size:13.5px; width:100%;
}
select{cursor:pointer}
.empty{border:1px dashed var(--line-strong); border-radius:var(--r); padding:26px 18px; text-align:center; color:var(--ink-2); background:var(--surface)}
.empty h3{font-size:15px; margin-bottom:4px}

/* ---------- cards grid ---------- */
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:15px}
.card h3{font-size:15px; margin-bottom:2px}
.card .meta{font-size:12.5px; color:var(--ink-3); margin-bottom:11px}
.kv{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:500}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink);
  padding:0; width:min(620px,calc(100vw - 24px)); max-height:min(86vh,760px);
  box-shadow:0 18px 50px rgba(0,0,0,.22);
}
dialog::backdrop{background:rgba(10,20,17,.45)}
.dlg-head{padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.dlg-head h3{font-size:16px; margin-right:auto}
.dlg-body{padding:16px 18px; overflow:auto; max-height:min(62vh,540px)}
.dlg-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.form .f{display:flex; flex-direction:column; gap:5px}
.form .f.wide{grid-column:1 / -1}
.form label{font-size:12.5px; color:var(--ink-2)}
.form .hint{font-size:12px; color:var(--ink-3)}
@media (max-width:560px){ .form{grid-template-columns:1fr} }

/* chips editor */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); background:var(--surface-2); border-radius:999px; padding:4px 5px 4px 11px; font-size:13px}
.chip button{border:0; background:none; cursor:pointer; color:var(--ink-3); line-height:1; padding:2px 4px; border-radius:999px}
.chip button:hover{background:var(--clay-soft); color:var(--clay)}

.banner{border:1px solid var(--line-strong); background:var(--ochre-soft); color:var(--ink); border-radius:var(--r); padding:11px 14px; font-size:13.5px; margin-bottom:16px}
.toast{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--canvas); padding:9px 16px; border-radius:999px; font-size:13.5px; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.25);
}
svg.chart{display:block; width:100%; height:auto}
.gate{max-width:460px; margin:8vh auto 40px; padding:0 4px}
.gate .card{padding:22px}
.gate h1{font-size:22px; letter-spacing:-.03em; margin-bottom:6px}
.gate p.lead{font-size:14px; color:var(--ink-2); margin:0 0 18px}
.gate .f{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.gate label{font-size:12.5px; color:var(--ink-2)}
.gate .hint{font-size:12px; color:var(--ink-3)}
.gate .acoes{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.gate .ou{display:flex; align-items:center; gap:10px; margin:22px 0 16px; color:var(--ink-3); font-size:12.5px}
.gate .ou::before,.gate .ou::after{content:""; flex:1; height:1px; background:var(--line)}
.gate .erro{background:var(--clay-soft); color:var(--clay); border-radius:7px; padding:9px 12px; font-size:13px; margin-bottom:14px}
.codigo{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.14em; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 14px; text-align:center}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark">Orçamento da casa</span>
      <span class="sub" id="brandSub">carregando…</span>
    </div>
    <div class="period" id="period">
      <button type="button" data-action="prev-period" aria-label="Período anterior">‹</button>
      <span class="label" id="periodLabel">—</span>
      <button type="button" data-action="next-period" aria-label="Próximo período">›</button>
    </div>
    <div class="seg" id="scopeSeg">
      <button type="button" data-action="scope" data-v="mes">Mês</button>
      <button type="button" data-action="scope" data-v="ano">Ano</button>
    </div>
    <button class="btn ghost" type="button" data-action="conta">Conta</button>
    <button class="btn ghost" type="button" data-action="toggle-theme" aria-label="Alternar tema">◐</button>
  </header>

  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-head"><h3 id="dlgTitle">—</h3><button class="btn ghost" type="button" data-action="dlg-close" aria-label="Fechar">✕</button></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot" id="dlgFoot"></div>
  </form>
</dialog>

<script>
"use strict";

/* =========================================================
   1. Utilidades
   ========================================================= */
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const BRL0 = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const money = v => BRL.format(Number(v) || 0);
const money0 = v => BRL0.format(Number(v) || 0);
const pct = (v, d) => (Number.isFinite(v) ? (v*100).toFixed(d === undefined ? 1 : d).replace('.', ',') + '%' : '—');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function parseMoney(s){
  if (typeof s === 'number') return s;
  if (!s) return 0;
  let t = String(s).replace(/[^\d,.\-]/g, '');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
}
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const monthOf = iso => (iso || '').slice(0, 7);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function monthLabel(m){ const [y, mm] = m.split('-'); return MESES[Number(mm)-1] + ' de ' + y; }
function shortMonth(m){ const [y, mm] = m.split('-'); return MESES[Number(mm)-1].slice(0,3) + '/' + y.slice(2); }
function addMonths(m, n){
  let [y, mm] = m.split('-').map(Number);
  const t = (y*12 + (mm-1)) + n;
  return String(Math.floor(t/12)) + '-' + String((t%12)+1).padStart(2,'0');
}
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y.slice(2); }
function addMonthsToDate(iso, n){
  if (!iso) return iso;
  const [y, m, d] = iso.split('-').map(Number);
  const t = y*12 + (m-1) + n;
  const ny = Math.floor(t/12), nm = (t%12) + 1;
  const ultimo = new Date(ny, nm, 0).getDate();
  return ny + '-' + String(nm).padStart(2,'0') + '-' + String(Math.min(d, ultimo)).padStart(2,'0');
}
function lastMonths(n, endM){
  const out = []; for (let i = n-1; i >= 0; i--) out.push(addMonths(endM, -i)); return out;
}

/* =========================================================
   2. Estado e configuração padrão
   ========================================================= */
const NATUREZAS = [
  {id:'necessidade', nome:'Necessidade', cls:'n', meta:50},
  {id:'desejo',      nome:'Desejo',      cls:'d', meta:30},
  {id:'meta',        nome:'Meta financeira', cls:'m', meta:20}
];
const natById = id => NATUREZAS.find(n => n.id === id) || NATUREZAS[0];

const DEFAULT_CONFIG = {
  tiposReceita: ['Salário','13º e férias','Rendimento de investimentos','Aluguel recebido','Trabalho autônomo','Benefício ou pensão','Reembolso','Outros'],
  tiposDespesa: [
    {nome:'Moradia', natureza:'necessidade'},
    {nome:'Mercado e alimentação', natureza:'necessidade'},
    {nome:'Contas de consumo', natureza:'necessidade'},
    {nome:'Transporte', natureza:'necessidade'},
    {nome:'Saúde', natureza:'necessidade'},
    {nome:'Educação', natureza:'necessidade'},
    {nome:'Seguros', natureza:'necessidade'},
    {nome:'Restaurantes e delivery', natureza:'desejo'},
    {nome:'Lazer e cultura', natureza:'desejo'},
    {nome:'Assinaturas e streaming', natureza:'desejo'},
    {nome:'Vestuário', natureza:'desejo'},
    {nome:'Cuidados pessoais', natureza:'desejo'},
    {nome:'Viagens', natureza:'desejo'},
    {nome:'Presentes', natureza:'desejo'},
    {nome:'Aporte em investimentos', natureza:'meta'},
    {nome:'Reserva de emergência', natureza:'meta'},
    {nome:'Amortização de dívidas', natureza:'meta'},
    {nome:'Outros', natureza:'desejo'}
  ],
  classesDespesa: ['Fixa','Variável','Eventual'],
  metodos: ['Conta corrente','Pix','Dinheiro','Cartão de débito','Boleto','Cartão de crédito'],
  metaNec: 50, metaDes: 30, metaMet: 20,
  taxaRetirada: 4,
  rentabilidadeReal: 6,
  mesesReserva: 6,
  baseDespesa: 'media12'
};
const CARTEIRA_TIPOS = ['Investimento','Reserva de emergência','Objetivo'];
const METODO_CARTAO = 'Cartão de crédito';

    tab: 'painel',

/* =========================================================
   3. Conexão com a sua nuvem, contas e casa
   ========================================================= */
const CONN_KEY = 'orcamento-conexao-v1';
const COLS = ['receitas','despesas','cartoes','carteira'];

function lerHashConexao(){
  const h = location.hash || '';
  if (h.indexOf('#conn=') !== 0) return null;
  try {
    const partes = atob(h.slice(6)).split('|');
    if (partes[0] && partes[1]) return {url: partes[0], key: partes[1]};
  } catch(e){}
  return null;
}
function linkAcesso(){
  const c = Conn.get();
  if (!c) return '';
  return location.origin + location.pathname + '#conn=' + btoa(c.url + '|' + c.key);
}

const Conn = {
  get(){ try { return JSON.parse(localStorage.getItem(CONN_KEY) || 'null'); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(CONN_KEY, JSON.stringify(v)); } catch(e){} },
  clear(){ try { localStorage.removeItem(CONN_KEY); } catch(e){} }
};

const Store = {
  sb: null, user: null, casa: null, canal: null, canWrite: true,

  async init(){
    const doLink = lerHashConexao();
    if (doLink){
      Conn.set(doLink);
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash = ''; }
    }
    const c = Conn.get();
    if (!c || !c.url || !c.key){ state.screen = 'setup'; render(); return; }
    if (!window.supabase || !window.supabase.createClient){
      state.screen = 'setup';
      state.erro = 'A biblioteca do Supabase não carregou. Confira a conexão e recarregue a página.';
      render(); return;
    }
    try {
      this.sb = window.supabase.createClient(c.url, c.key, {auth:{persistSession:true, autoRefreshToken:true}});
    } catch(e){
      state.screen = 'setup'; state.erro = 'Endereço ou chave inválidos.'; render(); return;
    }
    state.screen = 'carregando'; render();
    let sess = null;
    try { sess = (await this.sb.auth.getSession()).data.session; }
    catch(e){ state.screen = 'setup'; state.erro = 'Não consegui falar com esse projeto. Confira o endereço.'; render(); return; }
    if (!sess){ state.screen = 'auth'; render(); return; }
    await this.abrirCasa();
  },

  async abrirCasa(){
    state.screen = 'carregando'; state.erro = ''; render();
    const { data: u } = await this.sb.auth.getUser();
    this.user = u && u.user;
    if (!this.user){ state.screen = 'auth'; render(); return; }
    const { data: m, error } = await this.sb
      .from('membros').select('household_id, households(nome, convite)')
      .eq('user_id', this.user.id).maybeSingle();
    if (error){
      state.screen = 'casa';
      state.erro = 'Erro ao ler a casa: ' + error.message + '. O script de estrutura já foi executado no banco?';
      render(); return;
    }
    if (!m){ state.screen = 'casa'; render(); return; }
    const h = m.households || {};
    this.casa = {id: m.household_id, nome: h.nome || 'Nossa casa', convite: h.convite || ''};
    await this.carregar();
    this.assinar();
    state.screen = 'app'; render();
  },

  async carregar(){
    const { data, error } = await this.sb
      .from('registros').select('id, colecao, dados').eq('household_id', this.casa.id);
    if (error){ toast('Falha ao carregar: ' + error.message); return; }
    COLS.forEach(c => state[c] = []);
    (data || []).forEach(r => { if (state[r.colecao]) state[r.colecao].push(Object.assign({id: r.id}, r.dados || {})); });
    const { data: cfg } = await this.sb
      .from('configuracoes').select('dados').eq('household_id', this.casa.id).maybeSingle();
    state.config = Object.assign({}, DEFAULT_CONFIG, (cfg && cfg.dados) || {});
    Object.keys(state.ready).forEach(k => state.ready[k] = true);
  },

  assinar(){
    if (this.canal){ try { this.sb.removeChannel(this.canal); } catch(e){} }
    let t = null;
    const refresh = () => {
      clearTimeout(t);
      t = setTimeout(async () => { await this.carregar(); if (state.screen === 'app') render(); }, 450);
    };
    const filtro = 'household_id=eq.' + this.casa.id;
    this.canal = this.sb.channel('casa-' + this.casa.id)
      .on('postgres_changes', {event:'*', schema:'public', table:'registros', filter: filtro}, refresh)
      .on('postgres_changes', {event:'*', schema:'public', table:'configuracoes', filter: filtro}, refresh)
      .subscribe();
  },

  async save(col, rec){
    const id = rec.id || uid();
    const body = Object.assign({}, rec); delete body.id;
    const arr = state[col];
    const i = arr.findIndex(r => r.id === id);
    const full = Object.assign({id}, body);
    if (i >= 0) arr[i] = full; else arr.push(full);
    if (state.screen === 'app') render();
    const { error } = await this.sb.from('registros').upsert({
      id, household_id: this.casa.id, colecao: col, dados: body, atualizado_em: new Date().toISOString()
    });
    if (error){ toast('Não salvou: ' + error.message); await this.carregar(); render(); }
    return id;
  },

  async remove(col, id){
    state[col] = state[col].filter(r => r.id !== id);
    if (state.screen === 'app') render();
    const { error } = await this.sb.from('registros').delete().eq('id', id);
    if (error){ toast('Não excluiu: ' + error.message); await this.carregar(); render(); }
  },

  async saveConfig(patch){
    state.config = Object.assign({}, state.config, patch);
    if (state.screen === 'app') render();
    const { error } = await this.sb.from('configuracoes')
      .upsert({household_id: this.casa.id, dados: state.config});
    if (error) toast('Não salvou as preferências: ' + error.message);
  },

  async entrar(email, senha){
    const { error } = await this.sb.auth.signInWithPassword({email, password: senha});
    if (error){ state.erro = traduzErro(error.message); render(); return; }
    state.erro = ''; await this.abrirCasa();
  },

  async criarConta(email, senha){
    const { data, error } = await this.sb.auth.signUp({email, password: senha});
    if (error){ state.erro = traduzErro(error.message); render(); return; }
    if (!data.session){
      state.erro = ''; state.aviso = 'Conta criada. Abra o e-mail enviado para confirmar e volte aqui para entrar.';
      render(); return;
    }
    state.erro = ''; await this.abrirCasa();
  },

  async criarCasa(nome){
    const { data, error } = await this.sb.rpc('criar_casa', {p_nome: nome});
    if (error){ state.erro = traduzErro(error.message); render(); return; }
    state.erro = ''; await this.abrirCasa();
  },

  async entrarPorConvite(codigo){
    const { data, error } = await this.sb.rpc('entrar_por_convite', {p_codigo: codigo});
    if (error){ state.erro = traduzErro(error.message); render(); return; }
    state.erro = ''; await this.abrirCasa();
  },

  async sair(){
    try { await this.sb.auth.signOut(); } catch(e){}
    location.reload();
  }
};

function traduzErro(m){
  const t = String(m || '');
  if (/Invalid login credentials/i.test(t)) return 'E-mail ou senha não conferem.';
  if (/Email not confirmed/i.test(t)) return 'Confirme o e-mail pelo link que o Supabase enviou.';
  if (/User already registered/i.test(t)) return 'Já existe conta com esse e-mail. Use Entrar.';
  if (/Password should be at least/i.test(t)) return 'A senha precisa de pelo menos 6 caracteres.';
  if (/convite não encontrado/i.test(t)) return 'Código de convite não encontrado.';
  if (/relation .* does not exist|schema cache/i.test(t)) return 'As tabelas ainda não existem no banco. Rode o script de estrutura no SQL Editor do Supabase.';
  return t;
}

/* =========================================================
   4. Cálculos
   ========================================================= */
const refMes = r => monthOf(r.dataExecutada || r.dataPrevista);

function noPeriodo(r, month, scope){
  const m = refMes(r);
  if (!m) return false;
  return scope === 'ano' ? m.slice(0,4) === month.slice(0,4) : m === month;
}
const periodoAtual = r => noPeriodo(r, state.ui.month, state.ui.scope);

const previsto = r => Number(r.valorPrevisto) || 0;
const realizadoR = r => r.status === 'recebido' ? (Number(r.valorRecebido) || Number(r.valorPrevisto) || 0) : 0;
const realizadoD = d => d.status === 'pago' ? (Number(d.valorPago) || Number(d.valorPrevisto) || 0) : 0;
const valorBase = (r, kind) => state.ui.base === 'previsto' ? previsto(r) : (kind === 'r' ? realizadoR(r) : realizadoD(r));
const soma = (arr, fn) => arr.reduce((a, x) => a + fn(x), 0);

function atrasado(r){
  const feito = r.status === 'recebido' || r.status === 'pago';
  return !feito && r.dataPrevista && r.dataPrevista < todayISO();
}

function tipoDespesaInfo(nome){
  return (state.config.tiposDespesa || []).find(t => t.nome === nome) || {nome, natureza:'desejo'};
}

/* --- resumo do período selecionado --- */
function resumo(){
  const rec = state.receitas.filter(periodoAtual);
  const des = state.despesas.filter(periodoAtual);
  const r = {
    receitaPrev: soma(rec, previsto),
    receitaReal: soma(rec, realizadoR),
    despesaPrev: soma(des, previsto),
    despesaReal: soma(des, realizadoD),
    passivaPrev: soma(rec.filter(x => x.classe === 'passiva'), previsto),
    passivaReal: soma(rec.filter(x => x.classe === 'passiva'), realizadoR),
    porNatureza: {},
    nRec: rec.length, nDes: des.length,
    aReceber: soma(rec.filter(x => x.status !== 'recebido'), previsto),
    aPagar: soma(des.filter(x => x.status !== 'pago'), previsto),
    vencidasRec: rec.filter(atrasado).length,
    vencidasDes: des.filter(atrasado).length
  };
  NATUREZAS.forEach(n => {
    const lista = des.filter(d => (d.natureza || tipoDespesaInfo(d.tipo).natureza) === n.id);
    r.porNatureza[n.id] = {prev: soma(lista, previsto), real: soma(lista, realizadoD)};
  });
  r.receita = state.ui.base === 'previsto' ? r.receitaPrev : r.receitaReal;
  r.despesa = state.ui.base === 'previsto' ? r.despesaPrev : r.despesaReal;
  r.passiva = state.ui.base === 'previsto' ? r.passivaPrev : r.passivaReal;
  r.saldo = r.receita - r.despesa;
  NATUREZAS.forEach(n => { r.porNatureza[n.id].v = state.ui.base === 'previsto' ? r.porNatureza[n.id].prev : r.porNatureza[n.id].real; });
  return r;
}

/* --- fatura do cartão --- */
function mesFatura(iso, diaFechamento){
  if (!iso) return '';
  const dia = Number(iso.slice(8,10));
  const m = monthOf(iso);
  const f = Number(diaFechamento) || 0;
  return (f && dia > f) ? addMonths(m, 1) : m;
}
const valorCartao = d => Number(d.valorPago) || Number(d.valorPrevisto) || 0;
function cartaoResumo(c){
  const lanc = state.despesas.filter(d => d.metodo === METODO_CARTAO && d.cartaoId === c.id);
  const emAberto = soma(lanc.filter(d => !d.faturaPaga), valorCartao);
  const usado = (Number(c.saldoInicial) || 0) + emAberto;
  const limite = Number(c.limiteTotal) || 0;
  const faturas = {};
  lanc.forEach(d => {
    const m = mesFatura(d.dataExecutada || d.dataPrevista, c.diaFechamento);
    if (!faturas[m]) faturas[m] = {total:0, aberto:0, itens:0};
    faturas[m].total += valorCartao(d); faturas[m].itens++;
    if (!d.faturaPaga) faturas[m].aberto += valorCartao(d);
  });
  return {limite, usado, disponivel: limite - usado, emAberto, faturas, lanc};
}

/* --- independência financeira --- */
function independencia(){
  const cfg = state.config;
  const hoje = monthOf(todayISO());
  const janela = lastMonths(12, hoje);

  const custoMes = m => soma(
    state.despesas.filter(d => refMes(d) === m && (d.natureza || tipoDespesaInfo(d.tipo).natureza) !== 'meta'),
    d => realizadoD(d) || 0
  );
  const passivaMes = m => soma(state.receitas.filter(r => refMes(r) === m && r.classe === 'passiva'), realizadoR);

  const custosJanela = janela.map(custoMes).filter(v => v > 0);
  const passivaJanela = janela.map(passivaMes);

  let custoMensal;
  if (cfg.baseDespesa === 'mes'){
    custoMensal = custoMes(state.ui.month) || custoMes(hoje);
  } else {
    custoMensal = custosJanela.length ? custosJanela.reduce((a,b)=>a+b,0) / custosJanela.length : custoMes(hoje);
  }
  if (!custoMensal){
    custoMensal = soma(
      state.despesas.filter(d => refMes(d) === state.ui.month && (d.natureza || tipoDespesaInfo(d.tipo).natureza) !== 'meta'),
      previsto
    );
  }
  const mesesComPassiva = passivaJanela.filter(v => v > 0).length;
  const passivaMensal = mesesComPassiva ? passivaJanela.reduce((a,b)=>a+b,0) / mesesComPassiva : 0;

  const investido = soma(state.carteira.filter(c => c.tipo === 'Investimento'), c => Number(c.valorAtual) || 0);
  const reserva = soma(state.carteira.filter(c => c.tipo === 'Reserva de emergência'), c => Number(c.valorAtual) || 0);
  const aporte = soma(state.carteira.filter(c => c.tipo === 'Investimento'), c => Number(c.aporteMensal) || 0);

  const taxa = (Number(cfg.taxaRetirada) || 4) / 100;
  const custoAnual = custoMensal * 12;
  const alvo = taxa > 0 ? custoAnual / taxa : 0;
  const progresso = alvo > 0 ? investido / alvo : 0;
  const cobertura = custoMensal > 0 ? passivaMensal / custoMensal : 0;
  const rendaPotencial = investido * taxa / 12;
  const coberturaPotencial = custoMensal > 0 ? rendaPotencial / custoMensal : 0;
  const mesesReserva = custoMensal > 0 ? reserva / custoMensal : 0;

  // tempo até o alvo, com aportes mensais e juro real
  let mesesFalta = null;
  const r = Math.pow(1 + (Number(cfg.rentabilidadeReal) || 0)/100, 1/12) - 1;
  if (alvo > 0){
    if (investido >= alvo) mesesFalta = 0;
    else if (r > 0){
      const num = alvo * r + aporte, den = investido * r + aporte;
      mesesFalta = (den > 0 && num > 0) ? Math.log(num/den) / Math.log(1+r) : Infinity;
    } else mesesFalta = aporte > 0 ? (alvo - investido) / aporte : Infinity;
  }
  return {custoMensal, custoAnual, passivaMensal, investido, reserva, aporte, taxa, alvo,
          progresso, cobertura, rendaPotencial, coberturaPotencial, mesesReserva, mesesFalta, r};
}

function duracao(meses){
  if (meses === null || !Number.isFinite(meses)) return 'sem previsão';
  if (meses <= 0) return 'alcançada';
  const m = Math.ceil(meses), a = Math.floor(m/12), res = m % 12;
  if (a === 0) return res + (res === 1 ? ' mês' : ' meses');
  if (res === 0) return a + (a === 1 ? ' ano' : ' anos');
  return a + (a === 1 ? ' ano e ' : ' anos e ') + res + (res === 1 ? ' mês' : ' meses');
}

function statusPill(r){
  const feito = r.status === 'recebido' || r.status === 'pago';
  if (feito) return '<span class="pill ok">' + (r.status === 'recebido' ? 'Recebido' : 'Pago') + '</span>';

  return '<span class="pill wait">' + (r.status === 'a_receber' ? 'A receber' : 'A pagar') + '</span>';
}
function bandaOrcamento(res){
  const base = res.receita;
  const segs = NATUREZAS.map(n => {
    const v = res.porNatureza[n.id].v;
    return {n, v, p: base > 0 ? v/base : 0};
  });
  const usado = segs.reduce((a,s) => a + s.p, 0);
  const sobra = Math.max(0, 1 - usado);
  const escala = Math.max(1, usado);
  const w = p => (p/escala*100).toFixed(2) + '%';
  const metas = [state.config.metaNec, state.config.metaDes, state.config.metaMet].map(Number);
  const acum = [metas[0], metas[0]+metas[1], metas[0]+metas[1]+metas[2]];

  let band = '<div class="band-track">';
  segs.forEach(s => {
    if (s.p > 0.001) band += '<div class="band-seg ' + s.n.cls + '" style="width:' + w(s.p) + '" title="' + esc(s.n.nome) + ': ' + money(s.v) + '">' +
      (s.p > 0.07 ? pct(s.p, 0) : '') + '</div>';
  });
  if (sobra > 0.001) band += '<div class="band-seg rest" style="width:' + w(sobra) + '" title="Sobra: ' + money(base - segs.reduce((a,s)=>a+s.v,0)) + '">' + (sobra > 0.07 ? 'sobra ' + pct(sobra,0) : '') + '</div>';
  band += '</div>';

  let marks = '<div class="band-marks">';
  acum.slice(0,2).forEach((a, i) => {
    const left = (a/100/escala*100);
    if (left < 99) marks += '<div class="band-mark" style="left:' + left.toFixed(2) + '%">meta ' + a + '%</div>';
  });
  marks += '</div>';

  const legend = '<div class="band-legend">' + segs.map((s, i) => {
    const alvo = metas[i];
    const dif = (s.p*100) - alvo;
    const bom = (s.n.id === 'meta') ? dif >= 0 : dif <= 0;
    return '<div class="leg ' + s.n.cls + '"><div class="t">' + s.n.nome + ' · meta ' + alvo + '%</div>' +
      '<div class="v">' + money(s.v) + '</div>' +
      '<div class="s ' + (bom ? 'pos' : 'neg') + '">' + pct(s.p,1) + ' da receita · ' +
      (Math.abs(dif) < 0.05 ? 'no alvo' : (dif > 0 ? '+' : '') + dif.toFixed(1).replace('.',',') + ' p.p.') + '</div></div>';
  }).join('') + '</div>';

  const nota = base <= 0
    ? '<p class="small muted" style="margin:12px 0 0">Cadastre receitas no período para que a régua 50/30/20 seja calculada.</p>'
    : (usado > 1 ? '<p class="small neg" style="margin:12px 0 0">As despesas somam ' + pct(usado,1) + ' da receita do período. A faixa está em escala comprimida.</p>' : '');

  return '<div class="band">' + band + marks + legend + nota + '</div>';
}
function grafico12(){
  const meses = lastMonths(12, state.ui.month);
  const dados = meses.map(m => ({
    m,
    rec: soma(state.receitas.filter(r => refMes(r) === m), r => realizadoR(r) || previsto(r)),
    des: soma(state.despesas.filter(d => refMes(d) === m), d => realizadoD(d) || previsto(d))
  }));
  const max = Math.max(1, ...dados.map(d => Math.max(d.rec, d.des)));
  const W = 720, H = 180, pad = 26, bw = (W - pad*2) / 12;
  let bars = '', labels = '';
  dados.forEach((d, i) => {
    const x = pad + i*bw;
    const hr = (d.rec/max) * (H - 40), hd = (d.des/max) * (H - 40);
    bars += '<rect x="' + (x+3).toFixed(1) + '" y="' + (H-24-hr).toFixed(1) + '" width="' + (bw/2-4).toFixed(1) + '" height="' + hr.toFixed(1) + '" rx="2" fill="var(--viridian)"><title>' + shortMonth(d.m) + ' · recebido ' + money(d.rec) + '</title></rect>';
    bars += '<rect x="' + (x+bw/2+1).toFixed(1) + '" y="' + (H-24-hd).toFixed(1) + '" width="' + (bw/2-4).toFixed(1) + '" height="' + hd.toFixed(1) + '" rx="2" fill="var(--clay)"><title>' + shortMonth(d.m) + ' · gasto ' + money(d.des) + '</title></rect>';
    labels += '<text x="' + (x + bw/2).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' + shortMonth(d.m).slice(0,3) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Receitas e despesas dos últimos doze meses">' +
    '<line x1="' + pad + '" y1="' + (H-24) + '" x2="' + (W-pad) + '" y2="' + (H-24) + '" stroke="var(--line)"/>' +
    bars + labels + '</svg>';
}

const $main = document.getElementById('main');
const $nav = document.getElementById('nav');

function render(){
  const app = state.screen === 'app';
  document.querySelector('.topbar').style.display = app ? '' : 'none';
  $nav.style.display = app ? '' : 'none';
  if (!app){
    if (state.screen === 'setup')      $main.innerHTML = telaSetup();
    else if (state.screen === 'auth')  $main.innerHTML = telaAuth();
    else if (state.screen === 'casa')  $main.innerHTML = telaCasa();
    else                               $main.innerHTML = telaCarregando();
    return;
  }
  const loading = Object.values(state.ready).some(v => !v);
  document.getElementById('brandSub').textContent =
    (Store.casa && Store.casa.nome) ? Store.casa.nome : 'nuvem própria';
  document.getElementById('periodLabel').textContent =
    state.ui.scope === 'ano' ? state.ui.month.slice(0,4) : monthLabel(state.ui.month);
  document.querySelectorAll('#scopeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.ui.scope)));

  $nav.innerHTML = TABS.map(t => '<button type="button" data-action="tab" data-v="' + t.id + '" aria-current="' + (state.ui.tab === t.id) + '">' + t.nome + '</button>').join('');

  if (loading){ $main.innerHTML = '<div class="empty"><h3>Abrindo a planilha</h3><p class="small">Buscando os lançamentos salvos.</p></div>'; return; }

  let body = '';
  if (!Store.canWrite) body += '<div class="banner">Você está vendo esta planilha em modo leitura. Peça permissão de edição para lançar receitas e despesas.</div>';

  switch (state.ui.tab){
    case 'receitas':  body += viewReceitas(); break;
    case 'despesas':  body += viewDespesas(); break;
    case 'cartoes':   body += viewCartoes(); break;
    case 'carteira':  body += viewCarteira(); break;
    case 'cadastros': body += viewCadastros(); break;
    default:          body += viewPainel();
  }
  $main.innerHTML = body;
}

let toastTimer = null;
function toast(msg){
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2800);
}

const dlg = document.getElementById('dlg');
const dlgTitle = document.getElementById('dlgTitle');
const dlgBody = document.getElementById('dlgBody');
const dlgFoot = document.getElementById('dlgFoot');
let dlgSubmit = null;

function ask(opts){
  return new Promise(resolve => {
    let done = false;
    dlgTitle.textContent = opts.title;
    dlgBody.innerHTML = '<p style="margin:0; color:var(--ink-2)">' + esc(opts.message || '') + '</p>';
    dlgFoot.innerHTML = opts.actions.map((a, i) =>
      '<button class="btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '') + '" type="button" data-ask="' + i + '">' + esc(a.label) + '</button>'
    ).join('');
    dlgSubmit = null;
    const onClick = e => {
      const b = e.target.closest('[data-ask]');
      if (!b) return;
      done = true; cleanup(); dlg.close();
      resolve(opts.actions[Number(b.dataset.ask)].value);
    };
    const onClose = () => { if (!done){ cleanup(); resolve(null); } };
    function cleanup(){ dlg.removeEventListener('click', onClick); dlg.removeEventListener('close', onClose); }
    dlg.addEventListener('click', onClick);
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}
const confirmar = (title, message, cta) => ask({
  title, message,
  actions: [{label:'Cancelar', value:false}, {label: cta || 'Confirmar', value:true, primary:true}]
});

function openForm(cfg){
  dlgTitle.textContent = cfg.title;
  dlgBody.innerHTML = '<div class="form">' + cfg.fields.map(f => fieldHTML(f, cfg.values || {})).join('') + '</div>';
  dlgFoot.innerHTML = (cfg.extra || '') +
    '<button class="btn" type="button" data-action="dlg-close">Cancelar</button>' +
    '<button class="btn primary" type="button" data-action="dlg-save">' + esc(cfg.cta || 'Salvar') + '</button>';
  dlgSubmit = () => {
    const out = {};
    cfg.fields.forEach(f => {
      const el = dlgBody.querySelector('[name="' + f.key + '"]');
      if (!el) return;
      out[f.key] = f.type === 'money' ? parseMoney(el.value) : (f.type === 'number' ? Number(el.value) : el.value);
    });
    const err = cfg.validate ? cfg.validate(out) : null;
    if (err){ toast(err); return; }
    cfg.onSave(out);
    dlg.close();
  };
  if (cfg.onMount) setTimeout(() => cfg.onMount(dlgBody), 0);
  dlg.showModal();
  const first = dlgBody.querySelector('input,select,textarea');
  if (first) setTimeout(() => first.focus(), 30);
}
function fieldHTML(f, v){
  const val = v[f.key] !== undefined && v[f.key] !== null ? v[f.key] : (f.default !== undefined ? f.default : '');
  let input;
  if (f.type === 'select'){
    input = '<select name="' + f.key + '"' + (f.onchange ? ' data-onchange="' + f.onchange + '"' : '') + '>' +
      (f.placeholder ? '<option value="">' + esc(f.placeholder) + '</option>' : '') +
      (f.options || []).map(o => {
        const ov = typeof o === 'string' ? o : o.value, ol = typeof o === 'string' ? o : o.label;
        return '<option value="' + esc(ov) + '"' + (String(ov) === String(val) ? ' selected' : '') + '>' + esc(ol) + '</option>';
      }).join('') + '</select>';
  } else if (f.type === 'textarea'){
    input = '<textarea name="' + f.key + '" rows="2">' + esc(val) + '</textarea>';
  } else if (f.type === 'money'){
    input = '<input name="' + f.key + '" type="text" inputmode="decimal" placeholder="0,00" value="' + (val === '' ? '' : String(val).replace('.', ',')) + '">';
  } else {
    input = '<input name="' + f.key + '" type="' + (f.type || 'text') + '"' + (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.max !== undefined ? ' max="' + f.max + '"' : '') + ' value="' + esc(val) + '">';
  }
  return '<div class="f' + (f.wide ? ' wide' : '') + '"><label>' + esc(f.label) + '</label>' + input +
         (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '</div>';
}

const PASSOS = [
  {value:'0',  label:'Não repetir'},
  {value:'1',  label:'Todo mês'},
  {value:'2',  label:'A cada 2 meses'},
  {value:'3',  label:'A cada 3 meses'},
  {value:'6',  label:'A cada 6 meses'},
  {value:'12', label:'Uma vez por ano'}
];
function camposRepeticao(){
  return [
    {key:'repetir', label:'Repetir', type:'select', options: PASSOS, default:'0',
     hint:'Repete sempre no mesmo dia do mês da data prevista.'},
    {key:'repeticoes', label:'Quantas vezes no total', type:'number', min:2, max:120, default:12,
     hint:'Contando com este primeiro lançamento.'}
  ];
}
function montarRepeticao(dlgBody){
  const sel = dlgBody.querySelector('[name="repetir"]');
  const qtd = dlgBody.querySelector('[name="repeticoes"]');
  if (!sel || !qtd) return;
  const wrap = qtd.closest('.f');
  const sync = () => { wrap.style.display = sel.value === '0' ? 'none' : ''; };
  sel.addEventListener('change', sync); sync();
}
function serieDe(base, o, kind){
  const passo = Number(o.repetir) || 0;
  const vezes = Math.max(2, Math.min(120, Number(o.repeticoes) || 2));
  if (passo <= 0) return [base];
  const serieId = uid();
  const out = [];
  for (let i = 0; i < vezes; i++){
    const item = Object.assign({}, base, {
      dataPrevista: addMonthsToDate(base.dataPrevista, i * passo),
      serieId, serieIndex: i + 1, serieTotal: vezes, serieTipo: 'recorrencia'
    });
    if (i > 0){
      item.status = kind === 'r' ? 'a_receber' : 'a_pagar';
      item.dataExecutada = '';
      if (kind === 'r') item.valorRecebido = ''; else { item.valorPago = ''; item.faturaPaga = false; }
    }
    out.push(item);
  }
  return out;
}

/* --- receita --- */
function formReceita(rec){
  const r = rec || {};
  const novo = !rec;
  openForm({
    title: rec ? 'Editar receita' : 'Nova receita',
    values: Object.assign({
      dataPrevista: state.ui.month + '-05', status: 'a_receber', classe: 'ativa', tipo: 'Salário'
    }, r),
    fields: [
      {key:'descricao', label:'Descrição', wide:true, hint:'Ex.: salário de setembro, aluguel do apartamento'},
      {key:'tipo', label:'Tipo', type:'select', options: state.config.tiposReceita},
      {key:'classe', label:'Classe', type:'select', options:[{value:'ativa',label:'Ativa — vem do trabalho'},{value:'passiva',label:'Passiva — vem do patrimônio'}], hint:'A renda passiva alimenta o indicador de independência.'},
      {key:'valorPrevisto', label:'Valor previsto', type:'money'},
      {key:'dataPrevista', label:'Data prevista', type:'date'}
    ].concat(novo ? camposRepeticao() : []).concat([
      {key:'status', label:'Situação', type:'select', options:[{value:'a_receber',label:'A receber'},{value:'recebido',label:'Recebido'}]},
      {key:'dataExecutada', label:'Data executada', type:'date', hint:'Preencha quando o dinheiro entrar.'},
      {key:'valorRecebido', label:'Valor recebido', type:'money', hint:'Deixe vazio para usar o previsto.'},
      {key:'obs', label:'Observação', type:'textarea', wide:true}
    ]),
    validate: o => !o.descricao ? 'Dê um nome para a receita.' : (!o.dataPrevista ? 'Informe a data prevista.' : null),
    onSave: async o => {
      if (o.status === 'recebido' && !o.dataExecutada) o.dataExecutada = todayISO();
      if (o.dataExecutada && o.status !== 'recebido') o.status = 'recebido';
      const repetir = o.repetir, repeticoes = o.repeticoes;
      delete o.repetir; delete o.repeticoes;
      if (!novo){ await Store.save('receitas', Object.assign({}, r, o)); toast('Receita atualizada'); return; }
      const itens = serieDe(o, {repetir, repeticoes}, 'r');
      for (const it of itens) await Store.save('receitas', it);
      toast(itens.length > 1 ? itens.length + ' receitas programadas' : 'Receita cadastrada');
    },
    onMount: body => { if (novo) montarRepeticao(body); }
  });
}

/* --- despesa / lançamento --- */
function formDespesa(rec){
  const d = rec || {};
  const novo = !rec;
  const tipos = (state.config.tiposDespesa || []).map(t => t.nome);
  openForm({
    title: rec ? 'Editar despesa' : 'Nova despesa',
    values: Object.assign({
      dataPrevista: state.ui.month + '-10', status:'a_pagar', tipo: tipos[0] || '',
      classeDespesa: (state.config.classesDespesa||[])[0] || '', metodo: (state.config.metodos||[])[0] || '',
      natureza: tipoDespesaInfo(tipos[0] || '').natureza, parcelas: 1
    }, d),
    fields: [
      {key:'descricao', label:'Descrição', wide:true, hint:'Ex.: mercado da semana, parcela do carro'},
      {key:'tipo', label:'Tipo', type:'select', options: tipos},
      {key:'natureza', label:'Natureza na régua 50/30/20', type:'select', options: NATUREZAS.map(n => ({value:n.id, label:n.nome}))},
      {key:'classeDespesa', label:'Classe', type:'select', options: state.config.classesDespesa},
      {key:'valorPrevisto', label:'Valor previsto', type:'money'},
      {key:'metodo', label:'Forma de pagamento', type:'select', options: state.config.metodos},
      {key:'cartaoId', label:'Qual cartão', type:'select', placeholder:'—', options: state.cartoes.map(c => ({value:c.id, label:c.nome}))}
    ].concat(novo ? [
      {key:'parcelas', label:'Parcelas no cartão', type:'number', min:1, max:72, default:1,
       hint:'1 para à vista. O valor previsto acima é o total da compra e será dividido.'}
    ] : []).concat([
      {key:'dataPrevista', label: novo ? 'Data da compra ou vencimento' : 'Data prevista', type:'date'}
    ]).concat(novo ? camposRepeticao() : []).concat([
      {key:'status', label:'Situação', type:'select', options:[{value:'a_pagar',label:'A pagar'},{value:'pago',label:'Pago'}]},
      {key:'dataExecutada', label:'Data executada', type:'date', hint:'Preencha quando o pagamento sair.'},
      {key:'valorPago', label:'Valor pago', type:'money', hint:'Deixe vazio para usar o previsto.'},
      {key:'obs', label:'Observação', type:'textarea', wide:true}
    ]),
    validate: o => !o.descricao ? 'Dê um nome para a despesa.' :
      (!o.dataPrevista ? 'Informe a data prevista.' :
      (o.metodo === METODO_CARTAO && !o.cartaoId ? 'Escolha qual cartão foi usado.' : null)),
    onSave: async o => {
      if (o.status === 'pago' && !o.dataExecutada) o.dataExecutada = todayISO();
      if (o.dataExecutada && o.status !== 'pago') o.status = 'pago';
      if (o.metodo !== METODO_CARTAO){ o.cartaoId = ''; o.faturaPaga = false; }
      else o.faturaPaga = d.faturaPaga === true;

      const repetir = o.repetir, repeticoes = o.repeticoes;
      const nParc = o.metodo === METODO_CARTAO ? Math.max(1, Math.min(72, Number(o.parcelas) || 1)) : 1;
      delete o.repetir; delete o.repeticoes; delete o.parcelas;

      if (!novo){ await Store.save('despesas', Object.assign({}, d, o)); toast('Despesa atualizada'); return; }

      let itens;
      if (nParc > 1){
        const total = Number(o.valorPrevisto) || 0;
        const base = Math.floor(total / nParc * 100) / 100;
        const serieId = uid();
        itens = [];
        for (let i = 0; i < nParc; i++){
          const v = i === nParc - 1 ? Math.round((total - base*(nParc-1)) * 100) / 100 : base;
          const item = Object.assign({}, o, {
            descricao: o.descricao + ' (' + (i+1) + '/' + nParc + ')',
            valorPrevisto: v,
            dataPrevista: addMonthsToDate(o.dataPrevista, i),
            serieId, serieIndex: i+1, serieTotal: nParc, serieTipo:'parcelamento', faturaPaga:false
          });
          if (i > 0){ item.status = 'a_pagar'; item.dataExecutada = ''; item.valorPago = ''; }
          else if (item.status === 'pago') item.valorPago = v;
          itens.push(item);
        }
      } else {
        itens = serieDe(o, {repetir, repeticoes}, 'd');
      }
      for (const it of itens) await Store.save('despesas', it);
      toast(itens.length > 1
        ? (nParc > 1 ? 'Compra em ' + nParc + 'x lançada' : itens.length + ' despesas programadas')
        : 'Despesa lançada');
    },
    onMount: body => {
      const sel = body.querySelector('[name="tipo"]');
      const nat = body.querySelector('[name="natureza"]');
      const met = body.querySelector('[name="metodo"]');
      const cart = body.querySelector('[name="cartaoId"]');
      const parc = body.querySelector('[name="parcelas"]');
      const rep = body.querySelector('[name="repetir"]');
      const cartWrap = cart ? cart.closest('.f') : null;
      const parcWrap = parc ? parc.closest('.f') : null;
      const repWrap = rep ? rep.closest('.f') : null;
      const qtdWrap = body.querySelector('[name="repeticoes"]') ? body.querySelector('[name="repeticoes"]').closest('.f') : null;

      const sync = () => {
        const isCard = met.value === METODO_CARTAO;
        if (cartWrap) cartWrap.style.display = isCard ? '' : 'none';
        if (parcWrap) parcWrap.style.display = isCard ? '' : 'none';
        const parcelado = isCard && Number(parc && parc.value) > 1;
        if (repWrap) repWrap.style.display = parcelado ? 'none' : '';
        if (qtdWrap) qtdWrap.style.display = (parcelado || !rep || rep.value === '0') ? 'none' : '';
      };
      if (sel && nat) sel.addEventListener('change', () => { nat.value = tipoDespesaInfo(sel.value).natureza; });
      if (met) met.addEventListener('change', sync);
      if (parc) parc.addEventListener('input', sync);
      if (rep) rep.addEventListener('change', sync);
      sync();
    }
  });
}

/* =========================================================
   9. CSV
   ========================================================= */
function csvOf(which){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const linhas = [];
  const num = v => String(Number(v)||0).replace('.', ',');
  if (which === 'receitas' || which === 'tudo'){
    linhas.push('RECEITAS');
    linhas.push(['Descrição','Tipo','Classe','Data prevista','Data executada','Situação','Valor previsto','Valor recebido'].map(q).join(';'));
    state.receitas.slice().sort((a,b)=>(a.dataPrevista||'').localeCompare(b.dataPrevista||'')).forEach(r =>
      linhas.push([r.descricao, r.tipo, r.classe === 'passiva' ? 'Passiva' : 'Ativa', r.dataPrevista, r.dataExecutada,
        r.status === 'recebido' ? 'Recebido' : 'A receber', num(r.valorPrevisto), num(realizadoR(r))].map(q).join(';')));
    linhas.push('');
  }
  if (which === 'despesas' || which === 'tudo'){
    linhas.push('DESPESAS');
    linhas.push(['Descrição','Tipo','Classe','Natureza','Forma de pagamento','Cartão','Data prevista','Data executada','Situação','Valor previsto','Valor pago'].map(q).join(';'));
    state.despesas.slice().sort((a,b)=>(a.dataPrevista||'').localeCompare(b.dataPrevista||'')).forEach(d => {
      const c = state.cartoes.find(x => x.id === d.cartaoId);
      linhas.push([d.descricao, d.tipo, d.classeDespesa, natById(d.natureza || tipoDespesaInfo(d.tipo).natureza).nome,
        d.metodo, c ? c.nome : '', d.dataPrevista, d.dataExecutada, d.status === 'pago' ? 'Pago' : 'A pagar',
        num(d.valorPrevisto), num(realizadoD(d))].map(q).join(';'));
    });
    linhas.push('');
  }
  if (which === 'tudo'){
    linhas.push('CARTÕES');
    linhas.push(['Nome','Limite total','Utilizado','Disponível','Vencimento','Fechamento'].map(q).join(';'));
    state.cartoes.forEach(c => { const r = cartaoResumo(c);
      linhas.push([c.nome, num(r.limite), num(r.usado), num(r.disponivel), c.diaVencimento, c.diaFechamento].map(q).join(';')); });
    linhas.push('');
    linhas.push('CARTEIRA');
    linhas.push(['Nome','Tipo','Valor atual','Valor alvo','Aporte mensal'].map(q).join(';'));
    state.carteira.forEach(c => linhas.push([c.nome, c.tipo, num(c.valorAtual), num(c.valorAlvo), num(c.aporteMensal)].map(q).join(';')));
  }
  return '\uFEFF' + linhas.join('\r\n');
}
async function exportar(which){
  const nome = 'orcamento-' + which + '-' + todayISO() + '.csv';
  const data = csvOf(which);
  try {
    const blob = new Blob([data], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Arquivo gerado');
  } catch(e){ toast('Exportação indisponível neste navegador.'); }
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action, id = btn.dataset.id, v = btn.dataset.v;

  switch (a){
    case 'tab': state.ui.tab = v; state.ui.filtroStatus = 'todos'; state.ui.filtroNatureza = 'todas'; state.ui.filtroTipo = 'todos'; render(); window.scrollTo({top:0}); break;
    case 'scope': state.ui.scope = v; render(); break;
    case 'base': state.ui.base = v; render(); break;
    case 'prev-period': state.ui.month = state.ui.scope === 'ano' ? addMonths(state.ui.month, -12) : addMonths(state.ui.month, -1); render(); break;
    case 'next-period': state.ui.month = state.ui.scope === 'ano' ? addMonths(state.ui.month, 12) : addMonths(state.ui.month, 1); render(); break;
    case 'toggle-theme': {
      const cur = document.documentElement.getAttribute('data-theme');
      const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      break;
    }
    case 'new-receita': formReceita(null); break;
    case 'edit-receita': formReceita(state.receitas.find(r => r.id === id)); break;
    case 'new-despesa': formDespesa(null); break;
    case 'edit-despesa': formDespesa(state.despesas.find(r => r.id === id)); break;
    case 'new-cartao': formCartao(null); break;
    case 'edit-cartao': formCartao(state.cartoes.find(r => r.id === id)); break;
    case 'new-carteira': formCarteira(null); break;
    case 'edit-carteira': formCarteira(state.carteira.find(r => r.id === id)); break;
    case 'edit-premissas': formPremissas(); break;

    case 'quick-receber': {
      const r = state.receitas.find(x => x.id === id); if (!r) break;
      await Store.save('receitas', Object.assign({}, r, {status:'recebido', dataExecutada: r.dataExecutada || todayISO(), valorRecebido: r.valorRecebido || r.valorPrevisto}));
      toast('Marcada como recebida'); break;
    }
    case 'quick-pagar': {
      const d = state.despesas.find(x => x.id === id); if (!d) break;
      await Store.save('despesas', Object.assign({}, d, {status:'pago', dataExecutada: d.dataExecutada || todayISO(), valorPago: d.valorPago || d.valorPrevisto}));
      toast('Marcada como paga'); break;
    }
    case 'pagar-fatura': {
      const c = state.cartoes.find(x => x.id === id); if (!c) break;
      const alvo = state.despesas.filter(d => d.metodo === METODO_CARTAO && d.cartaoId === c.id && !d.faturaPaga &&
        mesFatura(d.dataExecutada || d.dataPrevista, c.diaFechamento) === state.ui.month);
      if (!alvo.length){ toast('Nada em aberto nesta fatura'); break; }
      if (!await confirmar('Quitar fatura', 'A fatura de ' + shortMonth(state.ui.month) + ' tem ' + alvo.length + ' compra(s). Ao quitar, o limite volta a ficar disponível.', 'Quitar fatura')) break;
      for (const d of alvo) await Store.save('despesas', Object.assign({}, d, {
        faturaPaga: true, status:'pago',
        dataExecutada: d.dataExecutada || d.dataPrevista || todayISO(),
        valorPago: d.valorPago || d.valorPrevisto
      }));
      toast('Fatura quitada'); break;
    }
    case 'del': {
      const col = btn.dataset.col;
      const rec = state[col].find(r => r.id === id);
      if (!rec) break;
      const irmaos = rec.serieId ? state[col].filter(r => r.serieId === rec.serieId) : [];
      let escolha;
      if (irmaos.length > 1){
        const restantes = irmaos.filter(r => (r.dataPrevista || '') >= (rec.dataPrevista || ''));
        escolha = await ask({
          title: 'Excluir registro de uma série',
          message: 'Este lançamento faz parte de uma série de ' + irmaos.length + ' registros. O que você quer apagar?',
          actions: [
            {label:'Cancelar', value:null},
            {label:'Só este', value:'um', danger:true},
            {label:'Este e os ' + (restantes.length - 1) + ' seguintes', value:'frente', danger:true},
            {label:'A série toda', value:'tudo', danger:true}
          ]
        });
        if (!escolha) break;
        let alvo = [rec];
        if (escolha === 'frente') alvo = restantes;
        if (escolha === 'tudo') alvo = irmaos;
        for (const r of alvo) await Store.remove(col, r.id);
        toast(alvo.length + (alvo.length === 1 ? ' registro excluído' : ' registros excluídos'));
        break;
      }
      if (!await confirmar('Excluir registro', 'Isto apaga "' + (rec.descricao || rec.nome || 'o registro') + '" de vez. Não dá para desfazer.', 'Excluir')) break;
      await Store.remove(col, id); toast('Registro excluído'); break;
    }
    case 'export': exportar(v); break;
    case 'seed': seed(); break;

    case 'add-tipo-receita':
      formTexto('Novo tipo de receita', 'Nome do tipo', '', t => { Store.saveConfig({tiposReceita: (state.config.tiposReceita||[]).concat(t)}); toast('Tipo adicionado'); });
      break;
    case 'rm-tipo-receita': {
      const l = (state.config.tiposReceita||[]).slice(); l.splice(Number(btn.dataset.i), 1); Store.saveConfig({tiposReceita:l}); break;
    }
    case 'add-tipo-despesa': formTipoDespesa(-1); break;
    case 'edit-tipo-despesa': formTipoDespesa(Number(btn.dataset.i)); break;
    case 'rm-tipo-despesa': {
      const l = (state.config.tiposDespesa||[]).slice(); l.splice(Number(btn.dataset.i), 1); Store.saveConfig({tiposDespesa:l}); break;
    }
    case 'add-classe':
      formTexto('Nova classe de despesa', 'Nome da classe', '', t => { Store.saveConfig({classesDespesa: (state.config.classesDespesa||[]).concat(t)}); });
      break;
    case 'rm-classe': {
      const l = (state.config.classesDespesa||[]).slice(); l.splice(Number(btn.dataset.i), 1); Store.saveConfig({classesDespesa:l}); break;
    }
    case 'add-metodo':
      formTexto('Nova forma de pagamento', 'Nome', '', t => { Store.saveConfig({metodos: (state.config.metodos||[]).concat(t)}); });
      break;
    case 'rm-metodo': {
      const l = (state.config.metodos||[]).slice(); l.splice(Number(btn.dataset.i), 1); Store.saveConfig({metodos:l}); break;
    }
    case 'save-cfg-metas': {
      const patch = {};
      document.querySelectorAll('[data-cfg]').forEach(el => { patch[el.dataset.cfg] = Number(el.value); });
      Store.saveConfig(patch); toast('Metas salvas'); break;
    }
    case 'conn-save': {
      const url = (document.getElementById('cUrl').value || '').trim().replace(/\/+$/, '');
      const key = (document.getElementById('cKey').value || '').trim();
      if (!/^https?:\/\//.test(url) || !key){
        state.erro = 'Preencha o endereço (começando com https://) e a chave pública.'; render(); break;
      }
      Conn.set({url, key}); state.erro = ''; location.reload(); break;
    }
    case 'trocar-conexao': { Conn.clear(); location.reload(); break; }
    case 'auth-entrar': case 'auth-criar': {
      const email = (document.getElementById('aEmail').value || '').trim();
      const senha = document.getElementById('aSenha').value || '';
      if (!email || !senha){ state.erro = 'Informe e-mail e senha.'; render(); break; }
      btn.disabled = true; state.erro = ''; state.aviso = '';
      if (a === 'auth-entrar') await Store.entrar(email, senha); else await Store.criarConta(email, senha);
      break;
    }
    case 'casa-criar': {
      btn.disabled = true;
      await Store.criarCasa((document.getElementById('hNome').value || '').trim());
      break;
    }
    case 'casa-entrar': {
      const cod = (document.getElementById('hCod').value || '').trim();
      if (!cod){ state.erro = 'Cole o código de convite.'; render(); break; }
      btn.disabled = true; await Store.entrarPorConvite(cod); break;
    }
    case 'conta': dlgConta(); break;
    case 'sair': await Store.sair(); break;
    case 'copiar-link': {
      const l = linkAcesso();
      try { await navigator.clipboard.writeText(l); toast('Link copiado'); }
      catch(e){ toast('Copie manualmente: ' + l); }
      break;
    }
    case 'copiar-convite': {
      const t = (Store.casa && Store.casa.convite) || '';
      try { await navigator.clipboard.writeText(t); toast('Código copiado'); }
      catch(e){ toast('Copie manualmente: ' + t); }
      break;
    }
    case 'dlg-close': dlg.close(); break;
    case 'dlg-save': if (dlgSubmit) dlgSubmit(); break;
  }
});

  if (!el || el.tagName !== 'SELECT') return;
  if (el.dataset.action === 'filtro-status'){ state.ui.filtroStatus = el.value; render(); }
  if (el.dataset.action === 'filtro-natureza'){ state.ui.filtroNatureza = el.value; render(); }
  if (el.dataset.action === 'filtro-tipo'){ state.ui.filtroTipo = el.value; render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && dlg.open && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); if (dlgSubmit) dlgSubmit(); }
});

function dlgConta(){
  const c = Store.casa || {};
  dlgTitle.textContent = 'Conta e casa';
  dlgBody.innerHTML =
    '<div class="kv"><span class="k">Você</span><span class="v">' + esc(Store.user ? Store.user.email : '—') + '</span></div>' +
    '<div class="kv"><span class="k">Casa</span><span class="v">' + esc(c.nome || '—') + '</span></div>' +
    '<p class="small muted" style="margin:18px 0 8px">Para incluir alguém, passe este código. A pessoa cria a conta dela nesta mesma página e entra com ele — a partir daí vocês lançam nos mesmos dados, ao vivo.</p>' +
    '<div class="codigo">' + esc(c.convite || '—') + '</div>' +
    '<div style="margin-top:10px; display:flex; gap:7px; flex-wrap:wrap">' +
    '<button class="btn sm" type="button" data-action="copiar-convite">Copiar código</button>' +
    '<button class="btn sm" type="button" data-action="copiar-link">Copiar link de acesso</button></div>' +
    '<p class="small muted" style="margin:10px 0 0">O link de acesso já leva o endereço e a chave publicável embutidos, então a pessoa não precisa digitar nada disso — só criar a conta e colar o código acima.</p>';
  dlgFoot.innerHTML =
    '<button class="btn ghost" type="button" data-action="trocar-conexao">Trocar de nuvem</button>' +
    '<button class="btn" type="button" data-action="dlg-close">Fechar</button>' +
    '<button class="btn danger" type="button" data-action="sair">Sair da conta</button>';
  dlgSubmit = null;
  dlg.showModal();
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || dlg.open) return;
  const acao = state.screen === 'setup' ? 'conn-save'
             : state.screen === 'auth'  ? 'auth-entrar'
             : state.screen === 'casa'  ? (e.target && e.target.id === 'hCod' ? 'casa-entrar' : 'casa-criar')
             : null;
  if (!acao) return;
  const b = document.querySelector('[data-action="' + acao + '"]');
  if (b){ e.preventDefault(); b.click(); }
});

/* =========================================================
   12. Início
   ========================================================= */
render();
Store.init();
</script>
</body>
</html>
