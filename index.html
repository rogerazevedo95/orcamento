function normaliza(s){ return String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function lerAba(wb, nome, cols){
  const ws = wb.Sheets[nome];
  if (!ws) return [];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, cellDates:true, defval:''});
  if (!aoa.length) return [];
  const cab = aoa[0].map(normaliza);
  const idx = {};
  const usados = new Set();
  // 1) casamento exato do cabeçalho
  cols.forEach(c => {
    const alvo = normaliza(ROT[c]);
    const i = cab.findIndex((x, k) => x === alvo && !usados.has(k));
    if (i >= 0){ idx[c] = i; usados.add(i); }
  });
  // 2) só o que sobrou tenta prefixo, e nunca rouba coluna já usada
  cols.forEach(c => {
    if (idx[c] !== undefined) return;
    const alvo = normaliza(ROT[c]);
    const i = cab.findIndex((x, k) => !usados.has(k) && x && (x.indexOf(alvo) === 0 || alvo.indexOf(x) === 0));
    idx[c] = i;
    if (i >= 0) usados.add(i);
  });
  const out = [];
  for (let i = 1; i < aoa.length; i++){
    const linha = aoa[i];
    if (!linha || linha.every(v => String(v).trim() === '')) continue;
    const o = {_linha: i + 1};
    cols.forEach(c => { o[c] = idx[c] >= 0 ? linha[idx[c]] : ''; });
    out.push(o);
  }
  return out;
}
function validaReceita(o){
  const erros = [];
  const desc = String(o.descricao||'').trim();
  if (!desc) erros.push('descrição vazia');
  const dp = celulaParaData(o.dataPrevista);
  if (!dp) erros.push('data prevista inválida');
  const tipos = state.config.tiposReceita || [];
  let tipo = tipos.find(t => normaliza(t) === normaliza(o.tipo));
  if (!tipo && String(o.tipo||'').trim()) erros.push('tipo "' + o.tipo + '" não cadastrado');
  const cl = normaliza(o.classe);
  const classe = cl.indexOf('pass') === 0 ? 'passiva' : 'ativa';
  const de = celulaParaData(o.dataExecutada);
  const st = normaliza(o.status);
  const pendente = st.indexOf('a ') === 0 || st.indexOf('pend') === 0;
  const recebido = !pendente && (st.indexOf('receb') === 0 || !!de);
  return {erros, rec: {
    id: String(o.id||'').trim() || null,
    descricao: desc, tipo: tipo || tipos[0] || '', classe,
    valorPrevisto: parseMoney(o.valorPrevisto), dataPrevista: dp,
    status: recebido ? 'recebido' : 'a_receber',
    dataExecutada: recebido ? (de || dp) : '',
    valorRecebido: parseMoney(o.valorRecebido) || '',
    obs: String(o.obs||'').trim()
  }};
}
function validaDespesa(o){
  const erros = [];
  const desc = String(o.descricao||'').trim();
  if (!desc) erros.push('descrição vazia');
  const dp = celulaParaData(o.dataPrevista);
  if (!dp) erros.push('data prevista inválida');
  const tipos = (state.config.tiposDespesa||[]).map(t => t.nome);
  let tipo = tipos.find(t => normaliza(t) === normaliza(o.tipo));
  if (!tipo && String(o.tipo||'').trim()) erros.push('tipo "' + o.tipo + '" não cadastrado');
  tipo = tipo || tipos[0] || '';
  let nat = NATUREZAS.find(n => normaliza(n.nome) === normaliza(o.natureza));
  const metodos = state.config.metodos || [];
  let met = metodos.find(m => normaliza(m) === normaliza(o.metodo));
  if (!met && String(o.metodo||'').trim()) erros.push('forma de pagamento "' + o.metodo + '" não cadastrada');
  met = met || metodos[0] || '';
  let cartaoId = '';
  if (met === METODO_CARTAO){
    const c = state.cartoes.find(x => normaliza(x.nome) === normaliza(o.cartao));
    if (!c) erros.push('cartão "' + (o.cartao||'vazio') + '" não encontrado');
    else cartaoId = c.id;
  }
  const classes = state.config.classesDespesa || [];
  const cls = classes.find(c => normaliza(c) === normaliza(o.classe)) || classes[0] || '';
  const de = celulaParaData(o.dataExecutada);
  const st = normaliza(o.status);
  const pendente = st.indexOf('a ') === 0 || st.indexOf('pend') === 0;
  const pago = !pendente && (st.indexOf('pag') === 0 || !!de);
  return {erros, rec: {
    id: String(o.id||'').trim() || null,
    descricao: desc, tipo, classeDespesa: cls,
    natureza: nat ? nat.id : tipoDespesaInfo(tipo).natureza,
    valorPrevisto: parseMoney(o.valorPrevisto), dataPrevista: dp,
    status: pago ? 'pago' : 'a_pagar',
    dataExecutada: pago ? (de || dp) : '',
    valorPago: parseMoney(o.valorPago) || '',
    metodo: met, cartaoId, faturaPaga: pago,
    obs: String(o.obs||'').trim()
  }};
}

function lerAoa(wb, nome){
  const ws = wb.Sheets[nome];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''})
    .slice(1).filter(l => l && String(l[0]||'').trim() !== '');
}
function cadastrosDoArquivo(wb){
  const cartoes = lerAoa(wb, 'Cartões').concat(lerAoa(wb, 'Cartoes')).map(l => ({
    nome: String(l[0]).trim(),
    limiteTotal: parseMoney(l[1]),
    diaVencimento: Number(l[2]) || 10,
    diaFechamento: Number(l[3]) || 1,
    saldoInicial: parseMoney(l[4])
  }));
  const tiposD = lerAoa(wb, 'Tipos de despesa').map(l => {
    const n = NATUREZAS.find(x => normaliza(x.nome) === normaliza(l[1]));
    return {nome: String(l[0]).trim(), natureza: n ? n.id : 'desejo'};
  });
  const tiposR = lerAoa(wb, 'Tipos de receita').map(l => String(l[0]).trim());
  return {cartoes, tiposD, tiposR};
}
async function aplicarCadastros(cad){
  const novosTD = (cad.tiposD || []).filter(t => t.nome &&
    !(state.config.tiposDespesa||[]).some(x => normaliza(x.nome) === normaliza(t.nome)));
  const novosTR = (cad.tiposR || []).filter(t => t &&
    !(state.config.tiposReceita||[]).some(x => normaliza(x) === normaliza(t)));
  if (novosTD.length || novosTR.length){
    await Store.saveConfig({
      tiposDespesa: (state.config.tiposDespesa||[]).concat(novosTD),
      tiposReceita: (state.config.tiposReceita||[]).concat(novosTR)
    });
  }
  const novosC = (cad.cartoes || []).filter(c => c.nome &&
    !state.cartoes.some(x => normaliza(x.nome) === normaliza(c.nome)));
  if (novosC.length) await Store.saveMany('cartoes', novosC);
  return {tipos: novosTD.length + novosTR.length, cartoes: novosC.length};
}

function assinatura(r){
  return normaliza(r.descricao) + '|' + (r.dataPrevista || '') + '|' + (Math.round((Number(r.valorPrevisto)||0)*100)/100);
}

let importePendente = null;
async function lerArquivo(file){
  if (!xlsxPronto()){ toast('A biblioteca de planilhas não carregou.'); return; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {cellDates:true});
  const cad = cadastrosDoArquivo(wb);
  const feito = await aplicarCadastros(cad);
  if (feito.tipos || feito.cartoes) toast(feito.cartoes + ' cartões e ' + feito.tipos + ' tipos cadastrados');
  const rec = lerAba(wb, 'Receitas', COLS_REC).map(validaReceita);
  const des = lerAba(wb, 'Despesas', COLS_DES).map(validaDespesa);
  const idsR = new Set(state.receitas.map(r => r.id));
  const idsD = new Set(state.despesas.map(r => r.id));
  const sigR = new Set(state.receitas.map(assinatura));
  const sigD = new Set(state.despesas.map(assinatura));
  rec.forEach(x => { x.dup = !x.erros.length && !x.rec.id && sigR.has(assinatura(x.rec)); });
  des.forEach(x => { x.dup = !x.erros.length && !x.rec.id && sigD.has(assinatura(x.rec)); });
  const resumo = {
    receitas: rec, despesas: des, pularDup: true,
    novosR: rec.filter(x => !x.erros.length && !x.rec.id && !x.dup).length,
    attR: rec.filter(x => !x.erros.length && x.rec.id && idsR.has(x.rec.id)).length,
    novosD: des.filter(x => !x.erros.length && !x.rec.id && !x.dup).length,
    attD: des.filter(x => !x.erros.length && x.rec.id && idsD.has(x.rec.id)).length,
    dups: rec.filter(x => x.dup).length + des.filter(x => x.dup).length,
    erros: rec.filter(x => x.erros.length).length + des.filter(x => x.erros.length).length
  };
  importePendente = resumo;
  state.ui.tab = 'dados'; render();
  toast('Planilha lida. Confira antes de aplicar.');
}
async function aplicarImporte(){
  if (!importePendente) return;
  const prep = x => { const r = Object.assign({}, x.rec); if (!r.id) delete r.id; return r; };
  const vale = x => !x.erros.length && !(importePendente.pularDup && x.dup);
  const recs = importePendente.receitas.filter(vale).map(prep);
  const desp = importePendente.despesas.filter(vale).map(prep);
  const total = recs.length + desp.length;
  state.importando = {feito: 0, total};
  render();
  const passo = (f, t, base) => { state.importando = {feito: base + f, total}; render(); };
  const antesR = state.receitas.length, antesD = state.despesas.length;
  let r1 = {ok:true, gravados:0}, r2 = {ok:true, gravados:0};
  if (recs.length) r1 = await Store.saveMany('receitas', recs, (f, t) => passo(f, t, 0));
  if (r1.ok && desp.length) r2 = await Store.saveMany('despesas', desp, (f, t) => passo(f, t, recs.length));
  state.importando = null;
  importePendente = null;

  // confere no banco, não na memória
  await Store.carregar();
  const ganhoR = state.receitas.length - antesR, ganhoD = state.despesas.length - antesD;
  state.resultadoImporte = {
    esperadoR: recs.length, esperadoD: desp.length,
    entrouR: ganhoR, entrouD: ganhoD,
    ok: r1.ok && r2.ok && ganhoR === recs.length && ganhoD === desp.length,
    erro: Store.ultimoErro || ''
  };
  Store.ultimoErro = '';
  state.ui.tab = 'dados'; render();
}

/* =========================================================
   17. Acompanhamento — previsto × realizado × teto
   ========================================================= */
function mesesCompletosAntes(n){
  const base = state.ui.scope === 'ano' ? state.ui.month.slice(0,4) + '-12' : state.ui.month;
  const out = [];
  for (let i = 1; i <= n; i++) out.push(addMonths(base, -i));
  return out;
}

function acompanhamento(){
  const fator = state.ui.scope === 'ano' ? 12 : 1;
  const tetos = state.config.tetos || {};
  const desp = state.despesas.filter(periodoAtual);
  const rec  = state.receitas.filter(periodoAtual);
  const janela = mesesCompletosAntes(3);

  const cats = [];
  const vistos = new Set();
  (state.config.tiposDespesa || []).forEach(t => { cats.push(t.nome); vistos.add(t.nome); });
  desp.forEach(d => { if (d.tipo && !vistos.has(d.tipo)){ cats.push(d.tipo); vistos.add(d.tipo); } });

  const linhas = cats.map(cat => {
    const lista = desp.filter(d => (d.tipo || '') === cat);
    const nat = lista.length
      ? (lista[0].natureza || tipoDespesaInfo(cat).natureza)
      : tipoDespesaInfo(cat).natureza;
    const medias = janela.map(m =>
      soma(state.despesas.filter(d => refMes(d) === m && d.tipo === cat), realizadoD)
    ).filter(v => v > 0);
    return {
      cat, nat,
      prev: soma(lista, previsto),
      real: soma(lista, realizadoD),
      teto: (Number(tetos[cat]) || 0) * fator,
      media: medias.length ? medias.reduce((a,b)=>a+b,0)/medias.length : 0,
      n: lista.length
    };
  }).filter(l => l.prev > 0 || l.real > 0 || l.teto > 0);

  linhas.sort((a,b) => (b.real || b.prev) - (a.real || a.prev));

  const porNat = {};
  NATUREZAS.forEach(n => porNat[n.id] = {prev:0, real:0, teto:0});
  linhas.forEach(l => {
    const b = porNat[l.nat] || porNat.desejo;
    b.prev += l.prev; b.real += l.real; b.teto += l.teto;
  });

  const receita = {
    prev: soma(rec, previsto),
    real: soma(rec, realizadoR),
    porTipo: {}
  };
  rec.forEach(r => {
    const t = r.tipo || '—';
    if (!receita.porTipo[t]) receita.porTipo[t] = {prev:0, real:0};
    receita.porTipo[t].prev += previsto(r);
    receita.porTipo[t].real += realizadoR(r);
  });

  // ritmo: só faz sentido no mês corrente
  const hojeM = monthOf(todayISO());
  let ritmo = null;
  if (state.ui.scope === 'mes' && state.ui.month === hojeM){
    const hoje = new Date();
    const dias = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    const pctTempo = hoje.getDate() / dias;
    const totPrev = soma(linhas, l => l.prev), totReal = soma(linhas, l => l.real);
    ritmo = {pctTempo, pctGasto: totPrev > 0 ? totReal/totPrev : 0, dia: hoje.getDate(), dias};
  }

  return {linhas, porNat, receita, ritmo, fator,
    totPrev: soma(linhas, l => l.prev),
    totReal: soma(linhas, l => l.real),
    totTeto: soma(linhas, l => l.teto)};
}

function barraComparativa(real, prev, teto){
  const ref = Math.max(real, prev, teto, 1);
  const pr = (real/ref)*100, pp = (prev/ref)*100, pt = (teto/ref)*100;
  const estouro = teto > 0 && real > teto;
  let h = '<div class="cmp">';
  h += '<div class="cmp-fill" style="width:' + pr.toFixed(1) + '%;background:' + (estouro ? 'var(--clay)' : 'var(--viridian)') + '"></div>';
  if (prev > 0) h += '<div class="cmp-mark prev" style="left:' + pp.toFixed(1) + '%" title="previsto"></div>';
  if (teto > 0) h += '<div class="cmp-mark teto" style="left:' + pt.toFixed(1) + '%" title="teto"></div>';
  h += '</div>';
  return h;
}

function viewAcompanha(){
  const a = acompanhamento();
  const periodo = state.ui.scope === 'ano' ? 'no ano' : 'no mês';

  let h = '<div class="toolbar">' +
    '<button class="btn primary" type="button" data-action="salvar-tetos">Salvar tetos</button>' +
    '<button class="btn" type="button" data-action="teto-media">Usar a média de 3 meses como teto</button>' +
    '<span class="grow"></span>' +
    '<span class="small muted">Barra verde é o realizado. O traço cheio é o previsto, o tracejado é o teto.</span></div>';

  if (a.ritmo){
    const adiantado = a.ritmo.pctGasto > a.ritmo.pctTempo + 0.05;
    h += '<div class="banner" style="background:' + (adiantado ? 'var(--clay-soft)' : 'var(--viridian-soft)') + '">' +
      '<strong>Ritmo do mês:</strong> passaram ' + pct(a.ritmo.pctTempo,0) + ' dos dias (' + a.ritmo.dia + ' de ' + a.ritmo.dias + ') e ' +
      pct(a.ritmo.pctGasto,0) + ' do previsto já saiu. ' +
      (adiantado ? 'O gasto está correndo na frente do calendário.' : 'O gasto está acompanhando o calendário.') + '</div>';
  }

  h += '<div class="figrow" style="margin-bottom:22px">' +
    fig('Receita prevista', money(a.receita.prev)) +
    fig('Receita realizada', money(a.receita.real), a.receita.prev > 0 ? pct(a.receita.real/a.receita.prev,0) + ' do previsto' : '',
        a.receita.real >= a.receita.prev ? 'pos' : '') +
    fig('Despesa prevista', money(a.totPrev)) +
    fig('Despesa realizada', money(a.totReal), a.totPrev > 0 ? pct(a.totReal/a.totPrev,0) + ' do previsto' : '',
        a.totReal > a.totPrev ? 'neg' : 'pos') +
    fig('Teto definido', a.totTeto ? money(a.totTeto) : '—',
        a.totTeto ? (a.totReal > a.totTeto ? 'estourado em ' + money(a.totReal - a.totTeto) : 'sobra ' + money(a.totTeto - a.totReal)) : 'sem teto',
        a.totTeto && a.totReal > a.totTeto ? 'neg' : 'pos') +
    '</div>';

  /* ---- por natureza ---- */
  h += '<section class="sec">' + secHead('Por natureza', 'régua 50/30/20 sobre a receita realizada') +
    '<div class="tablewrap"><table style="min-width:640px"><thead><tr>' +
    '<th>Natureza</th><th class="num">Teto</th><th class="num">Previsto</th><th class="num">Realizado</th>' +
    '<th class="num">% da receita</th><th class="num">Alvo</th><th style="width:150px">Comparativo</th></tr></thead><tbody>';
  const baseRec = a.receita.real || a.receita.prev;
  NATUREZAS.forEach(n => {
    const b = a.porNat[n.id];
    const p = baseRec > 0 ? b.real/baseRec : 0;
    const alvo = metaDaNatureza(n);
    const bom = n.id === 'meta' ? p >= alvo : p <= alvo;
    h += '<tr><td><span class="pill ' + n.cls + '">' + n.nome + '</span></td>' +
      '<td class="num">' + (b.teto ? money(b.teto) : '—') + '</td>' +
      '<td class="num">' + money(b.prev) + '</td>' +
      '<td class="num" style="font-weight:600">' + money(b.real) + '</td>' +
      '<td class="num ' + (bom ? 'pos' : 'neg') + '">' + pct(p,1) + '</td>' +
      '<td class="num muted">' + pct(alvo,0) + '</td>' +
      '<td>' + barraComparativa(b.real, b.prev, b.teto) + '</td></tr>';
  });
  h += '</tbody></table></div></section>';

  /* ---- por categoria ---- */
  h += '<section class="sec">' + secHead('Por categoria', 'o teto é por mês; no modo ano ele é multiplicado por 12') +
    '<div class="tablewrap"><table><thead><tr>' +
    '<th>Categoria</th><th>Natureza</th><th class="num">Teto/mês</th><th class="num">Previsto</th>' +
    '<th class="num">Realizado</th><th class="num">Desvio</th><th class="num">Média 3 meses</th>' +
    '<th style="width:140px">Comparativo</th></tr></thead><tbody>';
  a.linhas.forEach(l => {
    const nat = natById(l.nat);
    const desvio = l.real - l.prev;
    const estouro = l.teto > 0 && l.real > l.teto;
    h += '<tr' + (estouro ? ' style="background:var(--clay-soft)"' : '') + '>' +
      '<td class="desc">' + esc(l.cat) + (l.n ? '<div class="sub">' + l.n + (l.n === 1 ? ' lançamento' : ' lançamentos') + '</div>' : '') + '</td>' +
      '<td><span class="pill ' + nat.cls + '">' + nat.nome + '</span></td>' +
      '<td class="num"><input type="text" inputmode="decimal" class="teto-in" data-cat="' + esc(l.cat) + '" value="' +
        ((state.config.tetos || {})[l.cat] ? String((state.config.tetos||{})[l.cat]).replace('.', ',') : '') + '" placeholder="—"></td>' +
      '<td class="num">' + money(l.prev) + '</td>' +
      '<td class="num" style="font-weight:600">' + money(l.real) + '</td>' +
      '<td class="num ' + (desvio > 0 ? 'neg' : 'pos') + '">' + (desvio > 0 ? '+' : '') + money(desvio) + '</td>' +
      '<td class="num muted">' + (l.media ? money(l.media) : '—') + '</td>' +
      '<td>' + barraComparativa(l.real, l.prev, l.teto) + '</td></tr>';
  });
  h += '</tbody></table></div>' +
    '<p class="small muted" style="margin-top:10px">Digite o teto mensal na coluna e clique em Salvar tetos. Categoria sem teto não dispara alerta.</p></section>';

  /* ---- receitas ---- */
  const tiposR = Object.keys(a.receita.porTipo);
  if (tiposR.length){
    h += '<section class="sec">' + secHead('Receitas ' + periodo) +
      '<div class="tablewrap"><table style="min-width:560px"><thead><tr><th>Tipo</th><th class="num">Previsto</th>' +
      '<th class="num">Realizado</th><th class="num">Desvio</th><th style="width:150px">Comparativo</th></tr></thead><tbody>';
    tiposR.sort((x,y) => a.receita.porTipo[y].prev - a.receita.porTipo[x].prev).forEach(t => {
      const b = a.receita.porTipo[t];
      const d = b.real - b.prev;
      h += '<tr><td class="desc">' + esc(t) + '</td>' +
        '<td class="num">' + money(b.prev) + '</td>' +
        '<td class="num" style="font-weight:600">' + money(b.real) + '</td>' +
        '<td class="num ' + (d < 0 ? 'neg' : 'pos') + '">' + (d > 0 ? '+' : '') + money(d) + '</td>' +
        '<td>' + barraComparativa(b.real, b.prev, 0) + '</td></tr>';
    });
    h += '</tbody></table></div></section>';
  }

  /* ---- maiores desvios ---- */
  const desvios = a.linhas.filter(l => Math.abs(l.real - l.prev) > 0)
    .sort((x,y) => Math.abs(y.real - y.prev) - Math.abs(x.real - x.prev)).slice(0, 5);
  if (desvios.length){
    h += '<section class="sec">' + secHead('Onde o mês escapou do plano') + '<div class="card">';
    desvios.forEach(l => {
      const d = l.real - l.prev;
      h += '<div class="kv"><span class="k">' + esc(l.cat) + '</span><span class="v ' + (d > 0 ? 'neg' : 'pos') + '">' +
        (d > 0 ? 'gastou ' + money(d) + ' a mais' : 'gastou ' + money(-d) + ' a menos') + '</span></div>';
    });
    h += '</div></section>';
  }
  return h;
}

/* =========================================================
   12. Início
   ========================================================= */
render();
Store.init();
</script>
</body>
</html>
